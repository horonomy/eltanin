[workspace]
resolver = "2"
members = [
    "crates/eltanin-core",
    "crates/eltanin-backend",
    "crates/eltanin-linux",
    "crates/eltanin-protocol",
    "crates/eltanin-agent",
    "crates/eltanin-audit",
    "crates/eltanin-cli",
    "crates/eltanin-apple",
]

# Layout and naming match the Jira Component table on HORO-772/HORO-780
# (crates/eltanin-core, eltanin-backend, eltanin-nvidia, eltanin-linux,
# eltanin-protocol, eltanin-agent, eltanin-cli, ebpf/eltanin-device-guard),
# not HORO-781's original finer-grained proposal — reconciled per ADR 0002.
#
# crates/eltanin-nvidia and ebpf/eltanin-device-guard are added to this
# workspace by the Feature ticket that first needs them (F-M1-002/007),
# not here — see docs/development/campaign-state.md.
# crates/eltanin-linux was added by F-M1-003/HORO-832.
# crates/eltanin-audit was added by F-M1-009/HORO-824.
# crates/eltanin-apple was added by F-M1-010/HORO-1012 (MVP 1.0 Apple
# Silicon scope amendment, HORO-1010+). It stays a normal (non-excluded)
# workspace member, exactly like eltanin-linux: its objc2/objc2-metal
# dependencies are target-gated to `cfg(target_os = "macos")` in its own
# Cargo.toml, so they never enter a non-macOS build's dependency graph,
# while the crate itself still participates in every
# `cargo {clippy,test,doc} --workspace` CI gate on every target.

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
# Founder decision (HORO-781): Apache License 2.0. See LICENSE/NOTICE at
# the repo root. `publish = false` means this doesn't gate crates.io
# publishing (not planned for MVP 1.0) — it documents this workspace's
# real license for cargo-deny (deny.toml) and any downstream consumer.
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.rust]
# "warn" is the floor for platform/vendor crates that will need FFI later
# (backends/nvidia-linux, platform/linux/ebpf). Every vendor-neutral crate
# in this workspace currently overrides this with `#![forbid(unsafe_code)]`
# in source, which always wins over this weaker workspace default — so this
# setting is presently inert for existing crates and only takes effect once
# an unsafe-needing crate is added without its own forbid.
unsafe_code = "warn"
