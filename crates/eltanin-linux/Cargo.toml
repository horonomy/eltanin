[package]
name = "eltanin-linux"
version = "0.1.0"
edition = "2021"
publish = false
description = "Linux adapter that derives WorkloadIdentity/ExecutionContext from observed /proc state (F-M1-003, HORO-832)."

[lints]
workspace = true

[features]
# Gates PeerCredential::new/PeerContext::new (crate::peer) — public
# constructors that bypass kernel derivation entirely, needed by
# downstream crates' test doubles (eltanin-agent's tests/) but never by
# production code. A Cargo feature, not #[cfg(test)], because #[cfg(test)]
# is only active when compiling this crate itself with --test, not for
# a downstream crate that depends on it normally. eltanin-agent enables
# this only in its [dev-dependencies], so it is active for `cargo test`
# but absent from every ordinary build.
test-support = []

[dependencies]
eltanin-core = { path = "../eltanin-core", version = "0.1.0" }
thiserror = { workspace = true }

# SO_PEERCRED access (crate::peer) is Linux-only and needed on no other
# target, so it is declared as a target-specific dependency rather than
# an unconditional one — kept out of the dependency graph entirely on
# any non-Linux build. rustix wraps the getsockopt(SO_PEERCRED) call in
# safe Rust, preserving this workspace's #![forbid(unsafe_code)] on
# every crate rather than requiring hand-written unsafe libc FFI (see
# ADR 0004, which reserves unsafe code for HORO-828 only).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "net"] }
