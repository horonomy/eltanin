[package]
name = "eltanin-agent"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true
description = "Eltanin privileged local authorization coordinator (MVP 1.0, F-M1-006 / HORO-788/838/839/840, F-M1-009 / HORO-824 audit adapter)."

[lints]
workspace = true

[[bin]]
name = "eltanin-agentd"
path = "src/bin/eltanin-agentd.rs"

[dependencies]
eltanin-core = { path = "../eltanin-core", version = "0.1.0" }
eltanin-linux = { path = "../eltanin-linux", version = "0.1.0" }
eltanin-protocol = { path = "../eltanin-protocol", version = "0.1.0" }
eltanin-backend = { path = "../eltanin-backend", version = "0.1.0" }
# F-M1-009/HORO-824's AuditEventSink adapter. eltanin-audit itself never
# depends back on eltanin-agent or eltanin-linux — see its crate docs.
eltanin-audit = { path = "../eltanin-audit", version = "0.1.0" }
thiserror = { workspace = true }
# Promoted from a dev-dependency (HORO-839) to a real one: the daemon
# binary loads a PolicyDocument from a JSON file at startup (HORO-840).
serde_json = { workspace = true }

# Socket-directory ownership validation (listener.rs) needs this
# process's own euid. rustix's safe geteuid() wrapper keeps this crate
# at #![forbid(unsafe_code)] instead of a hand-written unsafe libc call
# (see crates/eltanin-linux/Cargo.toml's identical rationale and ADR
# 0004). Scoped to `cfg(unix)` since the socket listener itself is
# Unix-only.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

# SIGTERM/SIGINT -> ShutdownHandle::shutdown() wiring (HORO-840, founder
# decision: signal-hook over hand-written unsafe libc sigaction, same
# #![forbid(unsafe_code)]-preserving trade-off as rustix in HORO-839).
# `iterator` is the only feature needed: a dedicated thread blocks on
# `Signals::forever()` and calls a safe method, no raw handler required.
[target.'cfg(unix)'.dependencies.signal-hook]
version = "0.3"
default-features = false
features = ["iterator"]

[dev-dependencies]
# Enables PeerCredential::new/PeerContext::new (test doubles only) for
# this crate's integration tests, without exposing them to production
# builds — see eltanin-linux/Cargo.toml's "test-support" feature doc.
eltanin-linux = { path = "../eltanin-linux", version = "0.1.0", features = ["test-support"] }
