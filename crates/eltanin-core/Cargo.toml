[package]
name = "eltanin-core"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true
description = "Eltanin vendor-neutral domain core: resource, identity, policy, lease, provenance (MVP 1.0 scaffold)."

[lints]
workspace = true

[features]
# Gates crate::peer::{PeerCredential,PeerContext}::new (aliases for
# ::from_kernel/::for_test) plus ::for_test — public constructors that
# bypass kernel derivation entirely, needed by downstream crates' test
# doubles (eltanin-agent's tests/) but never by production code. A
# Cargo feature, not #[cfg(test)], because #[cfg(test)] is only active
# when compiling this crate itself with --test, not for a downstream
# crate that depends on it normally. eltanin-agent enables this only in
# its [dev-dependencies], so it is active for `cargo test` but absent
# from every ordinary build. Relocated here from eltanin-linux by
# HORO-1013 so eltanin-macos can share the same test-support surface.
test-support = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
