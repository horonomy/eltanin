# cargo-deny configuration for Eltanin.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Eltanin's own license is Apache-2.0 (founder decision, HORO-781; see
# LICENSE/NOTICE and every crate's `license.workspace = true`). This list
# governs third-party dependency licenses, independent of that choice —
# common permissive licenses compatible with Apache-2.0 distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
# Every workspace crate now declares `license.workspace = true` = "Apache-2.0"
# (HORO-781), so this no longer needs to exempt them from the license
# check on that basis. `ignore = true` is kept because every crate here
# also has `publish = false` (not intended for crates.io) — cargo-deny's
# own docs recommend `ignore = true` for that case regardless of whether
# a `license` field is present, since the field's accuracy is moot for a
# crate that is never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
